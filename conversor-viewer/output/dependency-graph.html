      left: 16px;
      right: 16px;

<body>
  <div id="header">
    <div>

    <div id="controls">

      <button id="btnReset">Reset view</button>

  <div id="layout">

  </div>
  <div id="info"></div>

"PhysicsConfig.js","title":"core/typedefs/PhysicsConfig.js","namespace":"core","color":"#e6194b","font":{"size":10}},{"id":"core/typedefs/PluginObject.js","label":"PluginObject.js","title":"core/typedefs/PluginObject.js","namespace":"core","color":"#e6194b","font":{"size":10}},{"id":"core/typedefs/PluginObjectItem.js","label":"PluginObjectItem.js","title":"core/typedefs/PluginObjectItem.js","namespace":"core","color":"#e6194b","font":{"size":10}},{"id":"core/typedefs/RenderConfig.js","label":"RenderConfig.js","title":"core/typedefs/RenderConfig.js","namespace":"core","color":"#e6194b","font":{"size":10}},{"id":"core/typedefs/RenderNodesConfig.js","label":"RenderNodesConfig.js","title":"core/typedefs/RenderNodesConfig.js","namespace":"core","color":"#e6194b","font":{"size":10}},{"id":"core/typedefs/ScaleConfig.js","label":"ScaleConfig.js","title":"core/typedefs/ScaleConfig.js","namespace":"core","color":"#e6194b","font":{"size":10}},{"id":"core/typedefs/TimeStepCallback.js","label":"TimeStepCallback.js","title":"core/typedefs/TimeStepCallback.js","namespace":"core","color":"#e6194b","font":{"size":10}},{"id":"core/typedefs/TouchInputConfig.js","label":"TouchInputConfig.js","title":"core/typedefs/TouchInputConfig.js","namespace":"core","color":"#e6194b","font":{"size":10}},{"id":"core/typedefs/WidthHeight.js","label":"WidthHeight.js","title":"core/typedefs/WidthHeight.js","namespace":"core","color":"#e6194b","font":{"size":10}},{"id":"core/VisibilityHandler.js","label":"VisibilityHandler.js","title":"core/VisibilityHandler.js","namespace":"core","color":"#e6194b","font":{"size":10}}]);
    const edges = new vis.DataSet([{"from":"core/events/index.ts","to":"core/events/BLUR_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/BOOT_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/CONTEXT_LOST_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/DESTROY_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/FOCUS_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/HIDDEN_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/PAUSE_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/POST_RENDER_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/POST_STEP_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/PRE_RENDER_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/PRE_STEP_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/READY_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/RESUME_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/STEP_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/SYSTEM_READY_EVENT.ts"},{"from":"core/events/index.ts","to":"core/events/VISIBLE_EVENT.ts"},{"from":"core/Game.js","to":"core/events/index.ts"},{"from":"core/Game.js","to":"core/Config.js"},{"from":"core/Game.js","to":"core/CreateRenderer.js"},{"from":"core/Game.js","to":"core/DebugHeader.js"},{"from":"core/Game.js","to":"core/TimeStep.js"},{"from":"core/Game.js","to":"core/VisibilityHandler.js"},{"from":"core/index.js","to":"core/events/index.ts"},{"from":"core/index.js","to":"core/Config.js"},{"from":"core/index.js","to":"core/CreateRenderer.js"},{"from":"core/index.js","to":"core/DebugHeader.js"},{"from":"core/index.js","to":"core/TimeStep.js"},{"from":"core/index.js","to":"core/VisibilityHandler.js"},{"from":"core/VisibilityHandler.js","to":"core/events/index.ts"}]);

    const container = document.getElementById('mynetwork');
    const data = { nodes, edges };

    const options = {
      nodes: {
        shape: 'box',
        margin: 8,
        borderWidth: 1,
        borderWidthSelected: 2,
        shadow: true,
      },
      edges: {
        arrows: 'to',
        width: 0.5,
        color: { opacity: 0.5 },
      },
      physics: {
        enabled: true,
        forceAtlas2Based: {
          gravitationalConstant: -50,
          centralGravity: 0.01,
          springLength: 150,
          springConstant: 0.08,
        },
        solver: 'forceAtlas2Based',
        stabilization: { iterations: 150 },
      },
      interaction: {
        dragNodes: true,
        dragView: true,
        zoomView: true,
      },
    };

    const network = new vis.Network(container, data, options);

    network.on('click', function(params) {
      const info = document.getElementById('info');
      if (params.nodes.length > 0) {
        const id = params.nodes[0];
        const node = nodes.get(id);
        const conns = edges.get().filter(e => e.from === id || e.to === id);
        info.innerHTML = '<strong>' + node.title + '</strong><br>' +
          'Exports to: ' + conns.filter(e => e.from === id).length + ' · Imports from: ' + conns.filter(e => e.to === id).length;
        info.style.display = 'block';
      } else {
        info.style.display = 'none';
      }
    });

    document.getElementById('btnReset').onclick = () => network.fit();
    document.getElementById('btnFit').onclick = () => network.fit();

    // Namespace visibility
    const namespaces = [{"name":"core","count":48}];
    const nsCheckboxes = {};

    function getNodeNamespace(id) {
      const n = nodes.get(id);
      return n && n.namespace ? n.namespace : (id.split('/')[0] || 'root');
    }

    function applyNamespaceVisibility() {
      const hiddenNs = new Set();
      Object.keys(nsCheckboxes).forEach(ns => {
        if (!nsCheckboxes[ns].checked) hiddenNs.add(ns);
      });
      nodes.forEach(n => {
        const ns = n.namespace || n.id.split('/')[0] || 'root';
        nodes.update({ id: n.id, hidden: hiddenNs.has(ns) });
      });
    }

    const nsList = document.getElementById('nsList');
    namespaces.forEach(({ name, count }) => {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.dataset.ns = name;
      nsCheckboxes[name] = cb;
      cb.onchange = applyNamespaceVisibility;
      label.appendChild(cb);
      label.appendChild(document.createTextNode(name));
      const span = document.createElement('span');
      span.className = 'ns-count';
      span.textContent = ' (' + count + ')';
      label.appendChild(span);
      nsList.appendChild(label);
    });

    document.getElementById('btnShowAll').onclick = function() {
      Object.keys(nsCheckboxes).forEach(ns => { nsCheckboxes[ns].checked = true; });
      applyNamespaceVisibility();
    };

    document.getElementById('btnHideAll').onclick = function() {
      Object.keys(nsCheckboxes).forEach(ns => { nsCheckboxes[ns].checked = false; });
      applyNamespaceVisibility();
    };

    document.getElementById('search').oninput = function() {
      const q = this.value.trim().toLowerCase();
      if (!q) {
        nodes.forEach(n => nodes.update({ ...n, hidden: false }));
        return;
      }
      nodes.forEach(n => {
        const match = n.title.toLowerCase().includes(q);
        nodes.update({ ...n, hidden: !match });
      });
    };
  </script>
